<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <title>SunVisualizer — sun path &amp; zenith angle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="controls"></aside>
      <nav class="mobile-tabs" id="mobile-tabs">
        <button type="button" data-view="orbital" class="active">Orbital</button>
        <button type="button" data-view="surface">Surface</button>
      </nav>
      <div class="view active-mobile" id="orbital-view">
        <div class="view-label">Orbital — locked to solar plane (tilt visible)</div>
      </div>
      <div class="view" id="surface-view">
        <div class="view-label">Surface — sun path + zenith angle in your sky</div>
        <label class="view-corner-check">
          <input type="checkbox" id="track-sun" checked />
          Lock camera to sun
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
